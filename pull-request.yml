name: Pull request validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, rules, and emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install and build Firebase Functions
        working-directory: functions
        run: npm ci && npm run build

      - name: TypeScript validation
        run: pnpm run lint

      - name: Build application and API bundle
        run: pnpm run build
        env:
          VITE_FIREBASE_API_KEY: ci-placeholder-api-key
          VITE_FIREBASE_AUTH_DOMAIN: church-platform-admin-role-test.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: church-platform-admin-role-test
          VITE_FIREBASE_STORAGE_BUCKET: church-platform-admin-role-test.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: ci-placeholder-sender
          VITE_FIREBASE_APP_ID: ci-placeholder-app
          VITE_ADMIN_EMAILS: primary-admin@example.test,second-admin@example.test

      - name: Run Firestore rules and administrator role tests
        run: >-
          pnpm exec firebase emulators:exec
          --only firestore
          --project church-platform-admin-role-test
          "pnpm run test:rules:emulator && pnpm run test:admin:emulator"

      - name: Run task point-award integration test
        run: >-
          pnpm exec firebase emulators:exec
          --only firestore,functions
          --project church-platform-local
          "pnpm exec tsx scripts/test-points-emulator.ts"
        env:
          GCLOUD_PROJECT: church-platform-local
